# Xcode project definition. After editing run `make generate` (or just `make open`).
name: AKit
options:
  bundleIdPrefix: dev.ussov
  deploymentTarget:
    macOS: "15.0"
packages:
  AKitCore:
    path: AKitCore
targets:
  AKit:
    type: application
    platform: macOS
    sources:
      - AKit
      # In-app guides (Help menu, Guide buttons): read from the bundle's guides folder.
      - path: docs/guides
        type: folder
        buildPhase: resources
    dependencies:
      # One product per module the app imports (see AKitCore/Package.swift).
      - package: AKitCore
        product: AKitFoundation
      - package: AKitCore
        product: AKitModel
      - package: AKitCore
        product: AKitHarnesses
      - package: AKitCore
        product: AKitSkills
      - package: AKitCore
        product: AKitSkillsSh
      - package: AKitCore
        product: AKitSessions
      - package: AKitCore
        product: AKitUsage
      - package: AKitCore
        product: AKitMCP
      - package: AKitCore
        product: AKitBrain
      - package: AKitCore
        product: AKitInsights
      - package: AKitCore
        product: AKitProjectSetup
      - package: AKitCore
        product: AKitLab
      - package: AKitCore
        product: AKitErrorAnalysis
    postBuildScripts:
      # Records where this build comes from; shown at the bottom of the sidebar.
      - name: Stamp build source
        basedOnDependencyAnalysis: false
        script: |
          # A file of its own: Info.plist is written later in the build and would drop these keys.
          plist="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/BuildInfo.plist"
          mkdir -p "$(dirname "$plist")"
          /usr/bin/plutil -create xml1 "$plist"
          stamp() { /usr/bin/plutil -replace "$1" -string "$2" "$plist"; }
          # Not in release zips (make release): the maintainer's source folder means nothing elsewhere.
          [ "${AKIT_DIST:-}" = 1 ] || stamp AKitSourcePath "$SRCROOT"
          stamp AKitGitBranch "$(git -C "$SRCROOT" rev-parse --abbrev-ref HEAD 2>/dev/null)"
          stamp AKitGitCommit "$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null)"
          # The version is the latest date tag (vYYYY.MM.DD, see CLAUDE.md) and how many commits came after it.
          tag="$(git -C "$SRCROOT" describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null)"
          stamp AKitVersionTag "$tag"
          [ -z "$tag" ] || stamp AKitCommitsSinceTag "$(git -C "$SRCROOT" rev-list --count "$tag..HEAD" 2>/dev/null)"
          stamp AKitGitDirty "$(git -C "$SRCROOT" status --porcelain --untracked-files=no 2>/dev/null | head -1 | grep -q . && echo yes || echo no)"
          stamp AKitBuildDate "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    settings:
      base:
        PRODUCT_NAME: AKit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.ussov.akit
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AKit
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        # Ad-hoc signed ("Sign to Run Locally"), no App Sandbox,
        # so it can access ~/.claude, ~/.pi and project folders.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        # The build stamp script reads the git repository.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        # Orange icon for dev builds, so they are easy to tell from the installed app in the Dock.
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
schemes:
  AKit:
    build:
      targets:
        AKit: all
    run:
      config: Debug
