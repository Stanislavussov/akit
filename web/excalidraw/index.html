<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The Content-Security-Policy comes from AKit's akit-web: scheme handler (MapCanvasView.swift). -->
  <title>AKit Map</title>
  <style>
    html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    /* Off in AKit: the library button (shared libraries need the network). */
    .excalidraw .sidebar-trigger, .excalidraw .default-sidebar-trigger { display: none !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- bridge.js goes first: it sets EXCALIDRAW_ASSET_PATH before Excalidraw reads it, and mounts
       the canvas on DOMContentLoaded, after the scripts below have run. -->
  <script src="bridge.js"></script>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/excalidraw.production.min.js"></script>
</body>
</html>
